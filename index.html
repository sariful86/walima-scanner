<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Gate Verification Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f4f8; padding: 12px; text-align: center; }
    .container { max-width: 480px; margin: auto; background: #ffffff; padding: 18px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1a365d; font-size: 20px; margin-bottom: 3px; }
    .subtitle { font-size: 13px; color: #4a5568; margin-bottom: 15px; }

    /* Tabs */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: 2px solid #2b6cb0; background: white; color: #2b6cb0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: #2b6cb0; color: white; }
    
    .panel { display: none; }
    .panel.active { display: block; }
    
    /* Camera */
    #reader { width: 100%; border-radius: 10px; overflow: hidden; min-height: 260px; background: #000; margin-top: 10px; }
    .btn { padding: 11px 18px; border: none; border-radius: 7px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 4px; }
    .btn-blue { background: #2b6cb0; color: white; width: 92%; }
    .btn-green { background: #28a745; color: white; }
    .btn-red { background: #dc3545; color: white; }
    .btn-orange { background: #dd6b20; color: white; }
    input[type="text"] { width: 90%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 8px; font-size: 16px; text-transform: uppercase; margin-bottom: 10px; outline: none; }

    /* Modal Popup */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
    .modal-box { background: white; border-radius: 14px; width: 100%; max-width: 420px; overflow: hidden; animation: popIn 0.25s ease-out; text-align: left; }
    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-header { padding: 12px 16px; color: white; display: flex; justify-content: space-between; align-items: center; }
    .modal-header.allow { background: #28a745; }
    .modal-header.danger { background: #dc3545; }
    .modal-header.error { background: #e53e3e; }
    .modal-title { font-size: 18px; font-weight: bold; }
    .close-btn { background: rgba(0,0,0,0.25); border: none; color: white; font-size: 20px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

    .modal-body { padding: 16px; font-size: 15px; }
    .badge { background: #edf2f7; color: #2d3748; padding: 3px 8px; border-radius: 5px; font-family: monospace; font-weight: bold; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .divider { height: 1px; background: #e2e8f0; margin: 10px 0; }
    .counter-tag { font-size: 17px; font-weight: bold; }
    .alert-box { padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-top: 10px; text-align: center; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .btn-next { width: 100%; padding: 12px; background: #1a365d; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; margin-top: 14px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>Walima Entry Control</h2>
  <div class="subtitle">Gate Verification & Capacity Tracker / গেট প্রবেশ ব্যবস্থাপনা</div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button id="tabCamera" class="tab-btn active" onclick="switchView('camera')">📸 Camera Scanner<br><small>ক্যামেরা স্ক্যান</small></button>
    <button id="tabManual" class="tab-btn" onclick="switchView('manual')">⌨️ Manual Entry<br><small>টাইপ করে এন্ট্রি</small></button>
  </div>

  <!-- Camera Scanner -->
  <div id="panelCamera" class="panel active">
    <button id="startCamBtn" class="btn btn-green" onclick="startScanner()">📸 Start Camera / ক্যামেরা চালু</button>
    <button id="stopCamBtn" class="btn btn-red" onclick="stopScanner()" style="display:none;">❌ Stop Camera</button>
    <button id="torchBtn" class="btn btn-orange" onclick="toggleTorch()" style="display:none;">Torch: OFF</button>
    <div id="reader"></div>
  </div>

  <!-- Manual Input -->
  <div id="panelManual" class="panel">
    <input type="text" id="manualId" placeholder="Unique ID type karein (e.g. FM1-00101-01)">
    <br>
    <button class="btn btn-blue" onclick="submitManual()">Verify Guest / যাচাই করুন</button>
  </div>
</div>

<!-- Popup Modal -->
<div id="verifyModal" class="modal-overlay">
  <div class="modal-box">
    <div id="modalHeader" class="modal-header allow">
      <div id="modalStatusText" class="modal-title">VERIFIED</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent" class="modal-body">
      <!-- Data will be loaded dynamically -->
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
