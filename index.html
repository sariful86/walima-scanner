<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Gate Entry Pass Scanner</title>
  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); }
    h2 { margin: 5px 0; color: #1a365d; }
    .subtitle { font-size: 13px; color: #718096; margin-bottom: 15px; }
    .tab-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 5px; border: 2px solid #2b6cb0; background: white; color: #2b6cb0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: #2b6cb0; color: white; }
    .panel { display: none; }
    .panel.active { display: block; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; min-height: 250px; background: #1a202c; }
    input[type="text"] { width: 85%; padding: 12px; border: 1.5px solid #cbd5e0; border-radius: 6px; font-size: 16px; text-transform: uppercase; margin-bottom: 10px; }
    .btn { padding: 11px 18px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 4px; }
    .btn-blue { background: #2b6cb0; color: white; width: 90%; }
    .btn-green { background: #2f855a; color: white; }
    .btn-red { background: #c53030; color: white; }
    .btn-orange { background: #dd6b20; color: white; }
    
    /* Guest Detail Card */
    .card-box { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: left; display: none; }
    .card-box.success { background: #f0fff4; border: 2px solid #38a169; }
    .card-box.error { background: #fff5f5; border: 2px solid #e53e3e; }
    .card-title { font-size: 18px; font-weight: bold; color: #2d3748; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
    .badge { background: #2b6cb0; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <h2>Walima Entry Gate</h2>
  <div class="subtitle">Gate Entry & Verification Portal / প্রবেশ যাচাইকরণ</div>

  <!-- Mode Selection Tabs -->
  <div class="tab-bar">
    <button id="tabManual" class="tab-btn active" onclick="switchView('manual')">⌨️ Manual Entry<br><small>হাতে টাইপ করুন</small></button>
    <button id="tabCamera" class="tab-btn" onclick="switchView('camera')">📸 Camera Scanner<br><small>ক্যামেরা স্ক্যান</small></button>
  </div>

  <!-- Manual Entry Panel -->
  <div id="panelManual" class="panel active">
    <input type="text" id="manualId" placeholder="Unique ID likhein (e.g. FM-847101)">
    <br>
    <button class="btn btn-blue" onclick="submitManual()">Verify & Allow / যাচাই করুন</button>
  </div>

  <!-- Camera Panel -->
  <div id="panelCamera" class="panel">
    <button id="startCamBtn" class="btn btn-green" onclick="startScanner()">📸 Open Camera / ক্যামেরা চালু করুন</button>
    <button id="stopCamBtn" class="btn btn-red" onclick="stopScanner()" style="display:none;">❌ Stop Camera / বন্ধ করুন</button>
    <button id="torchBtn" class="btn btn-orange" onclick="toggleTorch()" style="display:none;">Flashlight: OFF</button>
    <div id="reader"></div>
  </div>

  <!-- Guest Details Result Box -->
  <div id="resultBox" class="card-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
