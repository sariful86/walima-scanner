<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Guest Entry Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 15px; }
    .container { max-width: 480px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    .manual-box { margin-top: 15px; padding: 15px; background: #eef2f3; border-radius: 8px; }
    input[type="text"] { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    button { padding: 10px 14px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; }
    #torchBtn { background: #ff9800; margin-bottom: 10px; display: none; }
    #result { margin-top: 15px; font-weight: bold; font-size: 17px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Walima Gate Scanner</h2>
    
    <button id="torchBtn" onclick="toggleTorch()">Flashlight: OFF</button>
    <div id="reader"></div>

    <div class="manual-box">
      <h3>Manual Entry</h3>
      <input type="text" id="manualIdInput" placeholder="Enter Unique ID (e.g. FM-847101)">
      <button onclick="handleManualSubmit()">Verify</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
