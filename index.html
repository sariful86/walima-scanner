<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Gate Entry App</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 10px; text-align: center; }
    .container { max-width: 480px; margin: auto; background: #1e293b; padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    h2 { color: #38bdf8; font-size: 20px; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }

    /* Live Summary Dashboard Bar */
    .dashboard-stats { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat-card { flex: 1; background: #334155; padding: 10px 6px; border-radius: 10px; text-align: center; border: 1px solid #475569; }
    .stat-title { font-size: 10px; color: #cbd5e1; text-transform: uppercase; margin-bottom: 2px; }
    .stat-value { font-size: 16px; font-weight: bold; color: #38bdf8; }
    .stat-value.success { color: #4ade80; }
    .stat-value.danger { color: #f87171; }

    /* Bottom App Style Tabs */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; border: 2px solid #38bdf8; background: #1e293b; color: #38bdf8; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }
    
    .panel { display: none; }
    .panel.active { display: block; }
    
    /* Camera */
    #reader { width: 100%; border-radius: 12px; overflow: hidden; min-height: 250px; background: #000; margin-top: 10px; border: 2px solid #475569; }
    .btn { padding: 12px 18px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 4px; width: 100%; }
    .btn-green { background: #16a34a; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-orange { background: #d97706; color: white; }
    input[type="text"] { width: 100%; padding: 12px; background: #0f172a; border: 2px solid #475569; color: white; border-radius: 8px; font-size: 16px; text-transform: uppercase; margin-bottom: 10px; outline: none; text-align: center; }

    /* Instant UPI Style Popup Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; padding: 15px; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-box { background: #1e293b; color: #f8fafc; border-radius: 16px; width: 100%; max-width: 400px; overflow: hidden; text-align: left; border: 1px solid #475569; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .modal-header { padding: 14px 18px; color: white; display: flex; justify-content: space-between; align-items: center; }
    .modal-header.allow { background: #15803d; }
    .modal-header.danger { background: #b91c1c; }
    .modal-header.error { background: #991b1b; }
    .modal-title { font-size: 16px; font-weight: bold; }
    .close-btn { background: rgba(0,0,0,0.3); border: none; color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

    .modal-body { padding: 18px; font-size: 15px; }
    .badge { background: #334155; color: #38bdf8; padding: 3px 8px; border-radius: 6px; font-family: monospace; font-weight: bold; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; color: #cbd5e1; }
    .counter-tag { font-size: 18px; font-weight: bold; }
    
    .alert-box { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 12px; text-align: center; }
    .alert-success { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
    .alert-danger { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    
    .auto-close-info { font-size: 11px; text-align: center; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Walima Gate App</h2>
  <div class="subtitle">Smart Gate Entry & Live Dashboard / স্মার্ট গেট এন্ট্রি</div>

  <!-- Live Dashboard Summary -->
  <div class="dashboard-stats">
    <div class="stat-card">
      <div class="stat-title">Total Log Aaye</div>
      <div id="statTotalEntered" class="stat-value success">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Baaki Log</div>
      <div id="statRemaining" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Total Scans</div>
      <div id="statTotalScans" class="stat-value">0</div>
    </div>
  </div>

  <!-- App Tabs -->
  <div class="tab-bar">
    <button id="tabCamera" class="tab-btn active" onclick="switchView('camera')">📸 Camera App</button>
    <button id="tabManual" class="tab-btn" onclick="switchView('manual')">⌨️ Manual Entry</button>
  </div>

  <!-- Camera View -->
  <div id="panelCamera" class="panel active">
    <button id="startCamBtn" class="btn btn-green" onclick="startScanner()">📸 Start Camera Scanner</button>
    <button id="stopCamBtn" class="btn btn-red" onclick="stopScanner()" style="display:none;">❌ Stop Camera</button>
    <button id="torchBtn" class="btn btn-orange" onclick="toggleTorch()" style="display:none;">Torch: OFF</button>
    <div id="reader"></div>
  </div>

  <!-- Manual Entry View -->
  <div id="panelManual" class="panel">
    <input type="text" id="manualId" placeholder="Unique ID likhein (e.g. FM1-00101-01)">
    <button class="btn" style="background: #0284c7; color: white;" onclick="submitManual()">Verify & Count / যাচাই করুন</button>
  </div>
</div>

<!-- Instant Success/Error Popup Modal -->
<div id="verifyModal" class="modal-overlay">
  <div class="modal-box">
    <div id="modalHeader" class="modal-header allow">
      <div id="modalStatusText" class="modal-title">VERIFIED</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent" class="modal-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
