<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walima Event Scanner</title>
    <!-- Hum style ko alag file me bhi rakh sakte hain, par abhi ek sath clean rakhte hain -->
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
        h2 { color: #333; }
        #scanner-container { width: 100%; max-width: 400px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input[type="text"] { width: 90%; padding: 12px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 20px; background: #28a745; color: white; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: left; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>Walima Entry Gate Scanner</h2>
    <div id="scanner-container">
        <p>Unique ID Enter ya Scan Karein</p>
        <input type="text" id="manual-input" placeholder="Jaise: FM1-00101-01" autocomplete="off">
        <br>
        <button onclick="checkEntry()">Verify ID</button>
        
        <div id="result"></div>
    </div>

    <!-- JavaScript file ko yahan joda gaya hai -->
    <script src="script.js"></script>
</body>
</html>
